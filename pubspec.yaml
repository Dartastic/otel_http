name: otel_http
description: OpenTelemetry instrumentation for `package:http`. Wraps any
  `http.Client` to emit a CLIENT-kind span per request with the HTTP
  semantic-convention attributes, injects W3C trace-context headers,
  and records exceptions / 4xx-5xx as Error status.
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_http
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6
  http: ^1.0.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
